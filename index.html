<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Conservatoire de Fossiles</title>
    <meta name="description" content="Application du Conservatoire de Fossiles & Galerie Paléontologique" />
    <meta property="og:title" content="Conservatoire de Fossiles" />
    <meta property="og:description" content="Application du Conservatoire de Fossiles & Galerie Paléontologique" />

    <!-- PWA & Mobile Web App Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fossiles" />
    <meta name="application-name" content="Conservatoire de Fossiles" />
    <meta name="msapplication-TileColor" content="#020617" />
    <meta name="msapplication-navbutton-color" content="#0f172a" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512x512.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512x512.png" />
  </head>
  <body class="bg-slate-950 text-slate-100">
    <div id="root"></div>
    
    <!-- PWA Service Worker & Install Prompt Integration -->
    <script>
      // 1. Enregistrement direct du Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(registration) {
              console.log('[PWA] Service Worker enregistré avec succès, scope:', registration.scope);
            })
            .catch(function(error) {
              console.error('[PWA] Échec enregistrement Service Worker:', error);
            });
        });
      }

      // 2. Écoute et stockage de l'événement beforeinstallprompt
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        // Empêche la mini-bannière automatique par défaut du navigateur
        e.preventDefault();
        // Stocke l'événement pour le déclencher sur le bouton personnalisé
        window.deferredPrompt = e;
        console.log('[PWA] Événement beforeinstallprompt capturé et prêt');
        window.dispatchEvent(new CustomEvent('pwa-installable', { detail: true }));
      });

      window.addEventListener('appinstalled', function() {
        window.deferredPrompt = null;
        console.log('[PWA] Application installée avec succès dans le système');
        window.dispatchEvent(new CustomEvent('pwa-installed', { detail: true }));
      });

      // 3. Fonction déclenchée au clic sur le bouton personnalisé
      window.installPWA = async function() {
        if (!window.deferredPrompt) {
          console.warn('[PWA] Aucun prompt d\'installation disponible pour le moment.');
          return 'unavailable';
        }
        // Affiche la véritable boîte de dialogue d'installation native du système
        window.deferredPrompt.prompt();
        // Attend la réponse de l'utilisateur
        const choiceResult = await window.deferredPrompt.userChoice;
        console.log('[PWA] Choix utilisateur:', choiceResult.outcome);
        // Réinitialise la variable car le prompt ne peut être utilisé qu'une fois
        window.deferredPrompt = null;
        return choiceResult.outcome; // 'accepted' ou 'dismissed'
      };
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
