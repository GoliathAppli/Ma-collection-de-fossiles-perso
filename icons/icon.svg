<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="goldGradLight" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#ca8a04" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded square with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4"/>
  
  <!-- Outer decorative circular ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.25" stroke-dasharray="8 6"/>
  <circle cx="256" cy="256" r="180" fill="#0b1120" stroke="url(#goldGrad)" stroke-width="3.5" filter="url(#goldGlow)"/>

  <!-- Ammonite Fossil Spiral Icon -->
  <g transform="translate(256, 256) scale(0.95)">
    <!-- Spiral chambers -->
    <path d="M 0,-140 C 77,-140 140,-77 140,0 C 140,77 77,140 0,140 C -77,140 -140,77 -140,0 C -140,-50 -105,-115 -50,-130" 
          fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round"/>
    
    <path d="M -50,-130 C -95,-110 -115,-50 -115,0 C -115,63 -63,115 0,115 C 63,115 115,63 115,0 C 115,-63 63,-115 0,-115 C -45,-115 -85,-80 -90,-25" 
          fill="none" stroke="url(#goldGrad)" stroke-width="11" stroke-linecap="round"/>

    <path d="M -90,-25 C -90,40 -40,90 0,90 C 40,90 90,40 90,0 C 90,-40 40,-90 0,-90 C -30,-90 -65,-60 -65,-10" 
          fill="none" stroke="url(#goldGrad)" stroke-width="9" stroke-linecap="round"/>

    <path d="M -65,-10 C -65,25 -25,65 0,65 C 25,65 65,25 65,0 C 65,-25 25,-65 0,-65 C -20,-65 -40,-40 -40,0" 
          fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round"/>

    <path d="M -40,0 C -40,18 -18,40 0,40 C 18,40 40,18 40,0 C 40,-18 18,-40 0,-40 C -12,-40 -20,-20 -20,0" 
          fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
          
    <circle cx="0" cy="0" r="10" fill="url(#goldGrad)"/>

    <!-- Chamber ribs / radial ribs -->
    <line x1="0" y1="-140" x2="0" y2="-115" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="45" y1="-132" x2="35" y2="-109" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="88" y1="-109" x2="72" y2="-90" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="121" y1="-70" x2="99" y2="-58" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="138" y1="-24" x2="114" y2="-20" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="138" y1="24" x2="114" y2="20" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="121" y1="70" x2="99" y2="58" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="88" y1="109" x2="72" y2="90" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="45" y1="132" x2="35" y2="109" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="0" y1="140" x2="0" y2="115" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="-45" y1="132" x2="-35" y2="109" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="-88" y1="109" x2="-72" y2="90" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="-121" y1="70" x2="-99" y2="58" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="-138" y1="24" x2="-114" y2="20" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="-138" y1="-24" x2="-114" y2="-20" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Elegant text banner at bottom -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" text-anchor="middle" fill="#fef08a" letter-spacing="4">CONSERVATOIRE</text>
  <text x="256" y="475" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#ca8a04" letter-spacing="6">DE FOSSILES</text>
</svg>